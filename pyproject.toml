[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfitr"
version = "0.1.0"
description = "Answer a few questions, get a personalized, fit-scored list of clickable job links. The consumer web app on top of the job-radar engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Justin Hawkes" }]
keywords = ["job-search", "job-board", "fastapi", "cli", "self-hosted", "cached-harvest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Office/Business",
]
dependencies = [
    "job-radar>=0.8,<0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
]
# The model bakeoff (bakeoff/). The applying scorer needs nothing beyond core
# deps; choix (+ numpy/scipy) is only for the asking-role Bradley-Terry ranking.
bakeoff = [
    "choix>=0.3.5",
]
# The semantic retrieval arm. A Model2Vec STATIC embedder — the token vectors were
# distilled offline from a real sentence-transformer, so encoding is a table lookup plus a
# weighted mean and there is no neural forward pass at runtime. That is what makes this
# affordable on a 2-vCPU box: measured 1,445 jobs/s end-to-end (including HTML stripping
# and section parsing) against fastembed/bge-base's ~5/s, with indistinguishable retrieval
# quality on the graded set (11 vs 12 top-rated jobs in the top 25, better recall@50).
#
# Deliberately NOT fastembed: it drags in onnxruntime, 69 MB on its own, for a model that
# measured no better here. numpy is explicit because the KNN is a brute-force matmul —
# 60,000 x 512 with 8 probes is ~7 ms, so no vector index is needed at this scale.
semantic = [
    "model2vec>=0.9",
    "numpy>=1.24",
]

[project.scripts]
jobfitr-snapshot = "jobfitr.snapshot:main"
jobfitr-serve = "jobfitr.server:main"
jobfitr-evict = "jobfitr.store:main"
jobfitr-resolve = "jobfitr.resolve:main"
jobfitr-vectors = "jobfitr.vectors:main"

[project.urls]
Homepage = "https://github.com/hawkesj12/jobfitr"
Repository = "https://github.com/hawkesj12/jobfitr"
Issues = "https://github.com/hawkesj12/jobfitr/issues"

[tool.setuptools]
packages = ["jobfitr", "jobfitr.prompts"]

# The prompts are DATA, and they have to reach the box. Without this the wheel installs
# the loader and none of the .md files, and every model call goes out with no system
# prompt at all — which fails as plausible-looking output, not as an error.
[tool.setuptools.package-data]
"jobfitr.prompts" = ["*.md"]

[tool.pytest.ini_options]
# `slow` is the full-corpus sweep — every one of the 123,015 (user x listing) pairs,
# about 20s. It is excluded by default so the everyday run stays under 10s and actually
# gets run; opt in with `-m slow` before a version capture, where the sampled layer is
# not good enough to be the proof of record.
markers = ["slow: full-corpus sweeps (opt in with -m slow)"]
addopts = "-m 'not slow'"
