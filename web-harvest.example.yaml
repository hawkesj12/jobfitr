# jobfitr — WIDE harvest config (the scheduled snapshot build)
#
# This is deliberately permissive: it pulls the BROAD job universe into
# jobs.json. Each user's NARROW lens (their titles, boosts, excludes, min_score)
# is applied later at request time in the API — never here. Copy to
# web-harvest.yaml to tune without touching the committed example.
#
# NOTE: job_radar still runs its relevance gate during harvest, so `signal_titles`
# must be a broad catch-all (a union of common role words across sectors) or most
# postings get dropped before they reach the cache. Keep it wide on purpose.
#
# Reality check: the free, no-key boards (remotive/jobicy/remoteok/himalayas/…)
# skew remote-tech. A broad non-tech harvest stays thin until Adzuna/USAJOBS keys
# are added — those two self-skip with no creds, so leaving them listed is safe.

profile:
  title_queries: # what we SEARCH the boards for (broad, cross-sector net)
    # tech + corporate
    - software engineer
    - developer
    - data
    - product manager
    - designer
    - marketing
    - sales
    - operations
    - customer success
    - project manager
    - analyst
    - writer
    - support
    - finance
    - human resources
    # broader sectors (Adzuna reaches these nationwide once keys are set)
    - manager
    - retail
    - nurse
    - healthcare
    - warehouse
    - driver
    - teacher
    - accountant
    - administrative assistant
  signal_titles: # relevance gate — broad union so most real roles pass
    - engineer
    - developer
    - programmer
    - manager
    - analyst
    - designer
    - specialist
    - coordinator
    - director
    - lead
    - consultant
    - scientist
    - writer
    - editor
    - marketer
    - accountant
    - technician
    - associate
    - representative
    - administrator
    - strategist
    - architect
    - officer
    - agent
    - planner
    - nurse
    - teacher
    - recruiter
    - success
    - support
    - operations
    - product
    - designer

filters:
  remote_only: false # keep on-site + hybrid too; the user narrows later
  # READ BY NOTHING IN THIS HARVEST — kept only because job_radar's Config expects the
  # key. Exactly three adapters consult `cfg.location` (adzuna, usajobs, google_jobs),
  # and all three are the per-user LIVE sources deliberately excluded from `boards:`
  # below. The nightly lane is free boards + per-company ATS, which fetch whole boards
  # and take no geography at all. Changing this value does not change the harvest.
  #
  # The place that actually decides geography for a search is `live._prep_location`, at
  # request time. (US-only intake is a third thing again — `store.servable_in_us`.)
  location: ""
  exclude_titles: [] # no exclusions at harvest — the user excludes at request time
  max_age_days: 90 # generous; per-user freshness is applied at request time
  min_score: 0 # harvest keeps everything; scoring/threshold happens per-request

sources:
  # Breadth for the nightly baseline = the FREE, no-key boards only. This harvest is
  # the tech-leaning baseline pool; the KEYED SEARCH APIs (adzuna, usajobs,
  # google_jobs) are deliberately NOT here — they are per-user, live-query-only
  # sources (jobfitr/live.py), fired by title+location on a search, not swept nightly.
  # Do NOT add them to this list: it would broaden the baseline off-tech and, for
  # google_jobs, burn the metered SerpApi quota on every harvest.
  boards:
    - remotive
    - jobicy
    - arbeitnow
    - remoteok
    - himalayas
    - hn
    - braintrust
    - techtree
  # Depth (per-company ATS) only runs when --watchlist is passed; defaults are fine.
  funnel:
    auto_grow: false # a read-only harvest never mutates a watchlist file
